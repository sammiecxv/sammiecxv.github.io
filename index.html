<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThreadTrace — App Prototype</title>
<link rel="stylesheet" href="../styles.css">
<meta name="ext-resource-dependency" content="../assets/logo-mark.svg" data-resource-id="logoMark" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<script src="honesty-shim.js"></script>
<script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  *::-webkit-scrollbar { width: 0 !important; height: 0 !important; display: none; }
  * { scrollbar-width: none; -ms-overflow-style: none; }
  body { background: var(--paper-200); font-family: var(--font-sans);
    display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
  #stage { display: flex; align-items: flex-start; justify-content: center; width: 100vw; height: 100vh; padding-top: 94px; box-sizing: border-box; }

  /* phone */
  .phone { width: 390px; height: 812px; background: var(--surface-page); border-radius: 46px;
    border: 10px solid #15110D; box-shadow: var(--shadow-xl); overflow: hidden; position: relative;
    display: flex; flex-direction: column; }
  .statusbar { height: 44px; flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; font-family: var(--font-mono); font-size: 13px; color: var(--ink-900); }
  .statusbar .time { font-weight: 600; letter-spacing: 0.02em; }
  .statusbar .glyphs { display: inline-flex; gap: 6px; align-items: center; }
  .phone-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }

  /* desktop */
  .desktop { width: 1200px; height: 782px; background: var(--surface-page); border-radius: 12px;
    box-shadow: var(--shadow-xl); overflow: hidden; position: relative; border: 1px solid var(--border-strong);
    display: flex; flex-direction: column; }
  .desktop-chrome { height: 36px; flex: 0 0 auto; background: var(--paper-200); border-bottom: 1px solid var(--border-hairline);
    display: flex; align-items: center; gap: 7px; padding: 0 14px; }
  .desktop-chrome .dot { width: 11px; height: 11px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.15); }
  .desktop-chrome .url { margin-left: 14px; font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-400); }
  .desktop-body { flex: 1; min-height: 0; position: relative; }

  /* animations */
  @keyframes tt-sweep-kf { 0% { top: 24px; } 50% { top: 250px; } 100% { top: 24px; } }
  .tt-sweep { animation: tt-sweep-kf 1.9s var(--ease-in-out) infinite; }
  @keyframes tt-spin-kf { to { transform: rotate(360deg); } }
  .tt-spin { animation: tt-spin-kf 900ms linear infinite; }
  @keyframes tt-track-kf { 0%,100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.06); opacity: 0.55; } }
  .tt-track { animation: tt-track-kf 2.4s var(--ease-in-out) infinite; }
  @keyframes tt-fade-kf { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .tt-fade { animation: tt-fade-kf var(--dur-slow) var(--ease-out); }
  @keyframes tt-sheet-kf { from { transform: translateY(100%); } to { transform: none; } }
  .tt-sheet { animation: tt-sheet-kf var(--dur-base) var(--ease-out); }
  @keyframes tt-drawer-kf { from { transform: translateX(100%); } to { transform: none; } }
  .tt-drawer { animation: tt-drawer-kf var(--dur-base) var(--ease-out); }
  .caption { text-align: center; margin-top: 16px; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em; color: var(--ink-400); }

  /* web passport surface (ported from passport.html) */
  .wp-frame { display: flex; flex-direction: column; }
  .browser { flex: 1; min-height: 0; background: var(--surface-page); border: 1px solid var(--border-strong);
    border-radius: 12px; box-shadow: var(--shadow-xl); overflow: hidden; display: flex; flex-direction: column; }
  .chrome { height: 40px; flex: 0 0 auto; background: var(--paper-200); border-bottom: 1px solid var(--border-hairline);
    display: flex; align-items: center; gap: 7px; padding: 0 14px; }
  .chrome .dot { width: 11px; height: 11px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.12); }
  .chrome .url { margin-left: 14px; font-family: var(--font-mono); font-size: 12px; color: var(--ink-500); }
  .viewport { flex: 1; min-height: 0; overflow: hidden; container: ttp / inline-size; background: var(--paper-100); }
  .tt-passport { height: 100%; display: block; position: relative; }
  .tt-rail { display: none; }
  .tt-topbar { display: block; position: relative; }
  .tt-main { height: 100%; overflow-y: auto; }
  .tt-main-inner { padding: 22px 20px 48px; max-width: 720px; margin: 0 auto; }
  .tt-hero-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
  .tt-two-col { display: grid; grid-template-columns: 1fr; gap: 20px; }
  .tt-facet-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @container ttp (min-width: 900px) {
    .tt-passport { display: grid; grid-template-columns: 248px 1fr; }
    .tt-rail { display: flex; flex-direction: column; padding: 24px 16px; border-right: 1px solid var(--border-hairline); background: var(--surface-sunken); height: 100%; box-sizing: border-box; }
    .tt-topbar { display: none; }
    .tt-main-inner { padding: 34px 40px 56px; max-width: 880px; margin: 0; }
    .tt-hero-grid { grid-template-columns: 300px 1fr; align-items: stretch; gap: 30px; }
    .tt-two-col { grid-template-columns: 1.3fr 1fr; gap: 40px; align-items: start; }
    .tt-facet-grid { grid-template-columns: repeat(3, 1fr); }
  }
  .seg { display: inline-flex; gap: 3px; padding: 3px; background: var(--surface-card); border: 1px solid var(--border-hairline); border-radius: var(--radius-md); }
  .seg button { border: none; cursor: pointer; padding: 5px 12px; border-radius: var(--radius-sm); background: transparent; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.03em; color: var(--ink-400); }
  .seg button.on { background: var(--indigo-500); color: var(--paper-50); }
  .tt-tabrow::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div id="stage"><div id="root"></div></div>

<script src="image-slot.js"></script>
<script src="data.js"></script>
<script type="text/babel" src="honesty-extras.jsx"></script>
<script type="text/babel" src="consumer.jsx"></script>
<script type="text/babel" src="supplier-extras.jsx"></script>
<script type="text/babel" src="supplier-datacollection.jsx"></script>
<script type="text/babel" src="supplier-trust.jsx"></script>
<script type="text/babel" src="supplier-mobile.jsx"></script>
<script type="text/babel" src="supplier.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="passport.jsx"></script>
<script type="text/babel">
  function StatusBar() {
    return (
      <div className="statusbar">
        <span className="time">9:41</span>
        <span className="glyphs">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="none"><rect x="0" y="6" width="3" height="5" rx="1" fill="currentColor"/><rect x="4.5" y="3.5" width="3" height="7.5" rx="1" fill="currentColor"/><rect x="9" y="1" width="3" height="10" rx="1" fill="currentColor"/><rect x="13.5" y="0" width="3" height="11" rx="1" fill="currentColor" opacity="0.35"/></svg>
          <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><path d="M8 2.2C10.3 2.2 12.4 3.1 14 4.6L8 10.6 2 4.6C3.6 3.1 5.7 2.2 8 2.2Z" stroke="currentColor" strokeWidth="1.2" fill="none"/></svg>
          <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="16" height="8" rx="1.5" fill="currentColor"/><rect x="23" y="4" width="1.5" height="4" rx="0.75" fill="currentColor" opacity="0.5"/></svg>
        </span>
      </div>
    );
  }

  function useFitScale(w, h) {
    const [scale, setScale] = React.useState(1);
    React.useLayoutEffect(() => {
      function fit() {
        const s = Math.min(1, (window.innerWidth - 48) / w, (window.innerHeight - 130) / h);
        setScale(s);
      }
      fit();
      window.addEventListener('resize', fit);
      return () => window.removeEventListener('resize', fit);
    }, [w, h]);
    return scale;
  }

  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "startView": "consumer",
    "evidenceDepth": "standard",
    "landingTab": "home",
    "swatch": "leaf",
    "showCommunity": true
  }/*EDITMODE-END*/;

  const WebPassport = window.WebPassport;

  function Root() {
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
    const [surface, setSurface] = React.useState(t.startView === 'web' ? 'web' : 'app'); // app | web
    React.useEffect(() => { setSurface(t.startView === 'web' ? 'web' : 'app'); }, [t.startView]);
    const [appPov, setAppPov] = React.useState('consumer'); // phone: consumer | supplier
    const [webPov, setWebPov] = React.useState('consumer'); // browser: consumer | business
    const [webMode, setWebMode] = React.useState('wide');
    const isApp = surface === 'app';
    const w = isApp ? 390 : 1240;
    const h = isApp ? 812 : 782;
    const scale = useFitScale(w, h + 40);

    const SURFACES = [['app', 'App'], ['web', 'Web']];

    return (
      <React.Fragment>
      <div style={{ position: 'fixed', top: 12, left: '50%', transform: 'translateX(-50%)', zIndex: 60, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8 }}>
        <div className="seg" style={{ boxShadow: 'var(--shadow-sm)' }}>
          {SURFACES.map(([id, label]) => (
            <button key={id} className={surface === id ? 'on' : ''} onClick={() => setSurface(id)}>{label}</button>
          ))}
        </div>
        {isApp ? (
          <div className="seg" style={{ boxShadow: 'var(--shadow-sm)' }}>
            {[['consumer', 'Consumer'], ['supplier', 'Business']].map(([id, label]) => (
              <button key={id} className={appPov === id ? 'on' : ''} onClick={() => setAppPov(id)}>{label}</button>
            ))}
          </div>
        ) : (
          <div className="seg" style={{ boxShadow: 'var(--shadow-sm)' }}>
            {[['consumer', 'Consumer'], ['business', 'Business']].map(([id, label]) => (
              <button key={id} className={webPov === id ? 'on' : ''} onClick={() => setWebPov(id)}>{label}</button>
            ))}
          </div>
        )}
      </div>
      <div style={{ transform: `scale(${scale})`, transformOrigin: 'top center' }}>
        {isApp ? (
          <div>
            <div className="phone">
              <StatusBar />
              <div className="phone-body">
                {appPov === 'consumer'
                  ? <ConsumerApp pov="consumer" onPov={setAppPov} tweaks={t} />
                  : <SupplierMobileApp onPov={setAppPov} />}
              </div>
            </div>
            <div className="caption">ThreadTrace · {appPov === 'consumer' ? 'consumer app' : 'business app'}</div>
          </div>
        ) : (
          <div>
            <div className="wp-frame" style={{ width: w, height: h }}>
              <div className="browser">
                <div className="chrome">
                  <span className="dot" style={{ background: '#E7C0AE' }}></span>
                  <span className="dot" style={{ background: '#ECD6A8' }}></span>
                  <span className="dot" style={{ background: '#C3D0AE' }}></span>
                  <span className="url">{webPov === 'business' ? 'threadtrace.app/business' : `threadtrace.app/p/${window.TT.passport.slug}`}</span>
                </div>
                <div className="viewport">
                  {webPov === 'business'
                    ? <SupplierApp pov="supplier" onPov={(p) => { if (p === 'consumer') setWebPov('consumer'); }} />
                    : <WebPassport />}
                </div>
              </div>
            </div>
            <div className="caption">ThreadTrace · {webPov === 'business' ? 'business console' : 'web passport'}</div>
          </div>
        )}
      </div>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Item detail" />
        <TweakRadio label="Evidence depth" value={t.evidenceDepth}
                    options={['summary', 'standard', 'forensic']}
                    onChange={(v) => setTweak('evidenceDepth', v)} />
        <TweakRadio label="Landing tab" value={t.landingTab}
                    options={['materials', 'story', 'circular']}
                    onChange={(v) => setTweak('landingTab', v)} />
        <TweakSection label="Passport" />
        <TweakRadio label="Garment swatch" value={t.swatch}
                    options={['indigo', 'madder', 'leaf']}
                    onChange={(v) => setTweak('swatch', v)} />
        <TweakToggle label="Community voices" value={t.showCommunity}
                     onChange={(v) => setTweak('showCommunity', v)} />
        <TweakSection label="Prototype" />
        <TweakRadio label="Start view" value={t.startView === 'web' ? 'web' : 'app'}
                    options={['app', 'web']}
                    onChange={(v) => setTweak('startView', v)} />
      </TweaksPanel>
      </React.Fragment>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
<template id="__bundler_thumbnail" data-bg-color="#F4F0E7">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#F4F0E7"/>
    <circle cx="600" cy="360" r="150" fill="none" stroke="#D8CFBC" stroke-width="26"/>
    <path d="M600 210 A150 150 0 0 1 723 431" fill="none" stroke="#2D3E6B" stroke-width="26" stroke-linecap="round"/>
    <text x="600" y="378" font-family="Georgia, serif" font-size="96" font-weight="500" fill="#1C1814" text-anchor="middle">75%</text>
    <text x="600" y="560" font-family="Georgia, serif" font-size="52" fill="#1C1814" text-anchor="middle">ThreadTrace</text>
    <text x="600" y="610" font-family="monospace" font-size="24" letter-spacing="6" fill="#6B6155" text-anchor="middle">GARMENT PASSPORT</text>
  </svg>
</template>
</body>
</html>
